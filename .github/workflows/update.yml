name: Update and deploy calendar

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"  # daily 03:17 UTC: re-scrape courses
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils && pip install openpyxl
      - name: Fetch courses and school holidays
        if: github.event_name != 'push'
        continue-on-error: true  # keep previous data if a source is down
        run: python scripts/update_sources.py
      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update course data" && git push)
      - name: Build calendar
        run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
