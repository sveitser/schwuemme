name: Update calendar

on:
  schedule:
    - cron: "17 4 * * 1"  # weekly, Monday 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch courses and school holidays
        if: github.event_name != 'push'
        run: python scripts/update_sources.py
      - name: Build calendar
        run: python scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "Update Rialto calendar" && git push)
